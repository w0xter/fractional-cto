        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f20e40]
        - paragraph [ref=f20e41]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f20e42]:
        - article [ref=f20e43]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f20e44]
          - paragraph [ref=f20e45]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f20e46]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f20e47]
          - paragraph [ref=f20e48]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f20e49]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f20e50]
          - paragraph [ref=f20e51]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
    - generic [ref=f20e52]:
      - generic [ref=f20e53]:
        - heading "Dos formas de trabajar juntos." [level=2] [ref=f20e54]
        - paragraph [ref=f20e55]: Empezamos por la necesidad real de la empresa y elegimos el nivel de implicación que tenga sentido.
      - generic [ref=f20e56]:
        - article [ref=f20e57]:
          - heading "Technical Clarity Sprint" [level=3] [ref=f20e58]
          - generic [ref=f20e59]: 1–2 semanas · alcance cerrado
          - paragraph [ref=f20e60]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f20e61]:
            - strong [ref=f20e62]: "El resultado:"
            - text: un plan técnico accionable para los próximos 90 días y, cuando aporte claridad, un prototipo para validar una hipótesis crítica.
        - article [ref=f20e63]:
          - heading "Fractional CTO" [level=3] [ref=f20e64]
          - generic [ref=f20e65]: Colaboración inicial · 3 meses
          - paragraph [ref=f20e66]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f20e67]:
            - strong [ref=f20e68]: "El resultado que buscamos:"
            - text: más capacidad de ejecución, menos decisiones concentradas en el founder y un equipo progresivamente más autónomo.
