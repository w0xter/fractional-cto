          - generic [ref=f18e60]: 1–2 semanas · alcance cerrado
          - paragraph [ref=f18e61]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f18e62]:
            - strong [ref=f18e63]: "El resultado:"
