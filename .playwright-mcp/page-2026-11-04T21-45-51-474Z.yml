        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f11e41]
        - paragraph [ref=f11e42]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f11e43]:
        - article [ref=f11e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f11e45]
          - paragraph [ref=f11e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f11e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f11e48]
          - paragraph [ref=f11e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f11e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f11e51]
          - paragraph [ref=f11e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
