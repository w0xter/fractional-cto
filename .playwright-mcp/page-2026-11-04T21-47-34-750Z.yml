          - generic [ref=f18e66]: Colaboración inicial · 3 meses
          - paragraph [ref=f18e67]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f18e68]:
            - strong [ref=f18e69]: "El resultado que buscamos:"
