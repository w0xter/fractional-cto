        - article [ref=f22e42]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f22e43]
          - paragraph [ref=f22e44]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f22e45]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f22e46]
          - paragraph [ref=f22e47]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f22e48]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f22e49]
          - paragraph [ref=f22e50]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
