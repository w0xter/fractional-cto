          - generic [ref=f17e66]: Colaboración inicial · 3 meses
          - paragraph [ref=f17e67]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f17e68]:
            - strong [ref=f17e69]: "El resultado que buscamos:"
            - text: más capacidad de ejecución, menos decisiones concentradas en el founder y un equipo progresivamente más autónomo.
