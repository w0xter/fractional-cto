        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f14e41]
        - paragraph [ref=f14e42]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f14e43]:
        - article [ref=f14e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f14e45]
          - paragraph [ref=f14e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f14e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f14e48]
          - paragraph [ref=f14e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f14e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f14e51]
          - paragraph [ref=f14e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
    - generic [ref=f14e53]:
      - generic [ref=f14e54]:
        - heading "Dos formas de trabajar juntos." [level=2] [ref=f14e55]
        - paragraph [ref=f14e56]: Empezamos por la necesidad real de la empresa y elegimos el nivel de implicación que tenga sentido.
      - generic [ref=f14e57]:
        - article [ref=f14e58]:
          - generic [ref=f14e59]: 1–2 semanas · alcance cerrado
          - heading "Technical Clarity Sprint" [level=3] [ref=f14e60]
          - paragraph [ref=f14e61]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f14e62]:
            - strong [ref=f14e63]: "El resultado:"
            - text: un plan técnico accionable para los próximos 90 días y, cuando aporte claridad, un prototipo para validar una hipótesis crítica.
        - article [ref=f14e64]:
