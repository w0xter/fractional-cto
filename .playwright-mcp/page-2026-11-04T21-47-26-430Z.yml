          - generic [ref=f17e60]: 1–2 semanas · alcance cerrado
          - paragraph [ref=f17e61]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f17e62]:
            - strong [ref=f17e63]: "El resultado:"
            - text: un plan técnico accionable para los próximos 90 días y, cuando aporte claridad, un prototipo para validar una hipótesis crítica.
        - article [ref=f17e64]:
