        - article [ref=f8e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f8e45]
          - paragraph [ref=f8e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f8e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f8e48]
          - paragraph [ref=f8e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f8e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f8e51]
          - paragraph [ref=f8e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
