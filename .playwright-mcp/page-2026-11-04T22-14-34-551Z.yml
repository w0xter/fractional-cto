        - article [ref=f24e43]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f24e44]
          - paragraph [ref=f24e45]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f24e46]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f24e47]
          - paragraph [ref=f24e48]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f24e49]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f24e50]
          - paragraph [ref=f24e51]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
