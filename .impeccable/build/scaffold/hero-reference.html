<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: pick.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f4e7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-nav region chrome" data-region="nav"><!-- navegación superior --></div>
  <div class="r-headline region text" data-region="headline"><!-- titular principal --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- introducción --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-experience region text" data-region="experience"><!-- experiencia --><p style="font-size:var(--r-experience-font);line-height:1.05;margin:0">experience</p></div>
  <div class="r-cta region control" data-region="cta"><!-- solicitar conversación: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <figure class="r-portrait region plate" data-region="portrait"><img src="../../../assets/plates/portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-next-heading region text" data-region="next-heading"><!-- encabezado de la siguiente sección --><p style="font-size:var(--r-next-heading-font);line-height:1.05;margin:0">next-heading</p></div>
</main>
</body>
</html>
