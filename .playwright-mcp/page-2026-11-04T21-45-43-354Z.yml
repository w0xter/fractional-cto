        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f10e41]
        - paragraph [ref=f10e42]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f10e43]:
        - article [ref=f10e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f10e45]
          - paragraph [ref=f10e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f10e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f10e48]
          - paragraph [ref=f10e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f10e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f10e51]
          - paragraph [ref=f10e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
