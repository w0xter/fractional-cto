        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f25e39]
        - paragraph [ref=f25e40]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f25e41]:
        - article [ref=f25e42]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f25e43]
          - paragraph [ref=f25e44]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f25e45]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f25e46]
          - paragraph [ref=f25e47]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f25e48]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f25e49]
          - paragraph [ref=f25e50]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
    - generic [ref=f25e51]:
      - generic [ref=f25e52]:
        - heading "Dos formas de trabajar juntos." [level=2] [ref=f25e53]
        - paragraph [ref=f25e54]: Empezamos por la necesidad real de la empresa y elegimos el nivel de implicación que tenga sentido.
      - generic [ref=f25e55]:
        - article [ref=f25e56]:
          - heading "Technical Clarity Sprint" [level=3] [ref=f25e57]
          - generic [ref=f25e58]: 1–2 semanas · alcance cerrado
          - paragraph [ref=f25e59]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f25e60]:
            - strong [ref=f25e61]: "El resultado:"
            - text: un plan técnico accionable para los próximos 90 días y, cuando aporte claridad, un prototipo para validar una hipótesis crítica.
        - article [ref=f25e62]:
          - heading "Fractional CTO" [level=3] [ref=f25e63]
          - generic [ref=f25e64]: Colaboración inicial · 3 meses
          - paragraph [ref=f25e65]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f25e66]:
            - strong [ref=f25e67]: "El resultado que buscamos:"
            - text: más capacidad de ejecución, menos decisiones concentradas en el founder y un equipo progresivamente más autónomo.
