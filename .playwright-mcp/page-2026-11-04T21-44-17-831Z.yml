          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f5e41]
          - paragraph [ref=f5e42]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f5e43]:
