          - paragraph [ref=f14e67]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f14e68]:
            - strong [ref=f14e69]: "El resultado que buscamos:"
            - text: más capacidad de ejecución, menos decisiones concentradas en el founder y un equipo progresivamente más autónomo.
