        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f17e41]
        - paragraph [ref=f17e42]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f17e43]:
        - article [ref=f17e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f17e45]
          - paragraph [ref=f17e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f17e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f17e48]
          - paragraph [ref=f17e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f17e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f17e51]
          - paragraph [ref=f17e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
    - generic [ref=f17e53]:
      - generic [ref=f17e54]:
        - heading "Dos formas de trabajar juntos." [level=2] [ref=f17e55]
        - paragraph [ref=f17e56]: Empezamos por la necesidad real de la empresa y elegimos el nivel de implicación que tenga sentido.
      - generic [ref=f17e57]:
        - article [ref=f17e58]:
