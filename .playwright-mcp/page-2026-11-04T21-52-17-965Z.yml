        - heading "Quizá estás en uno de estos momentos." [level=2] [ref=f19e41]
        - paragraph [ref=f19e42]: Cuando el software es clave para el negocio, las decisiones técnicas no pueden quedarse al margen de la estrategia.
      - generic [ref=f19e43]:
        - article [ref=f19e44]:
          - heading "Hay demanda, pero el producto aún no está preparado." [level=3] [ref=f19e45]
          - paragraph [ref=f19e46]: Un MVP, un piloto o los primeros clientes han demostrado una oportunidad. Ahora toca decidir qué construir, qué conservar y cómo convertirlo en un producto fiable.
        - article [ref=f19e47]:
          - heading "Hay equipo, pero falta dirección técnica." [level=3] [ref=f19e48]
          - paragraph [ref=f19e49]: Las decisiones llegan al founder, las entregas son impredecibles o los desarrolladores necesitan liderazgo senior para avanzar con autonomía.
        - article [ref=f19e50]:
          - heading "Hay una decisión importante por delante." [level=3] [ref=f19e51]
          - paragraph [ref=f19e52]: Evolucionar o reconstruir, contratar, incorporar IA o preparar el producto para un cliente relevante. Antes de comprometer recursos, necesitamos entender las opciones.
    - generic [ref=f19e53]:
      - generic [ref=f19e54]:
        - heading "Dos formas de trabajar juntos." [level=2] [ref=f19e55]
        - paragraph [ref=f19e56]: Empezamos por la necesidad real de la empresa y elegimos el nivel de implicación que tenga sentido.
      - generic [ref=f19e57]:
        - article [ref=f19e58]:
          - heading "Technical Clarity Sprint" [level=3] [ref=f19e59]
          - generic [ref=f19e60]: 1–2 semanas · alcance cerrado
          - paragraph [ref=f19e61]: Una intervención enfocada para aclarar la incertidumbre que frena la siguiente etapa. Revisamos producto, riesgos, arquitectura, prioridades y equipo.
          - paragraph [ref=f19e62]:
            - strong [ref=f19e63]: "El resultado:"
            - text: un plan técnico accionable para los próximos 90 días y, cuando aporte claridad, un prototipo para validar una hipótesis crítica.
        - article [ref=f19e64]:
          - heading "Fractional CTO" [level=3] [ref=f19e65]
          - generic [ref=f19e66]: Colaboración inicial · 3 meses
          - paragraph [ref=f19e67]: "Asumo el liderazgo técnico junto al founder: decisiones de arquitectura, roadmap, dirección de ingeniería, entregas y equipo."
          - paragraph [ref=f19e68]:
            - strong [ref=f19e69]: "El resultado que buscamos:"
            - text: más capacidad de ejecución, menos decisiones concentradas en el founder y un equipo progresivamente más autónomo.
